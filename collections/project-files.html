<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Project Files - AUROS</title>
  <meta name="description" content="Complete Premiere Pro project files for video editing. Full timeline templates with transitions, color grading, and professional workflows. Instant download.">
  <link rel="canonical" href="/collections/project-files.html">
  <meta property="og:title" content="Project Files - AUROS">
  <meta property="og:description" content="Complete Premiere Pro project files for video editing. Full timeline templates with transitions, color grading, and professional workflows. Instant download.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/collections/project-files.html">
  <link href="../css/theme.css" rel="stylesheet">
  <link href="../css/animations.css" rel="stylesheet">
  <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/png">
</head>
<body>
  <a href="#main" style="position:absolute;left:1rem;top:0.5rem;z-index:100;background:#171717;color:white;padding:0.5rem 1rem;border-radius:0.375rem;transform:translateY(-100%);transition:transform 0.2s;" onfocus="this.style.transform='translateY(0)'" onblur="this.style.transform='translateY(-100%)'">Skip to content</a>

  <div class="page-transition" id="pageTransition"></div>

  <div id="app-header"></div>

  <main id="main">
    <section class="page-banner reveal">
      <div class="page-container">
        <div class="breadcrumbs reveal reveal-left" style="transition-delay:0.1s;">
          <a href="../index.html">Home</a>
          <span class="sep">/</span>
          <span class="current">Project Files</span>
        </div>
        <h1 class="reveal" style="transition-delay:0.2s;">Project Files</h1>
        <p class="reveal" style="transition-delay:0.3s;">Browse our collection of Premiere Pro project files</p>
      </div>
    </section>

    <section class="collection-section">
      <div class="page-container">
        <div class="collection-toolbar">
          <span class="collection-count" id="collection-count">0 products</span>
          <select class="collection-sort" id="collection-sort" aria-label="Sort by">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Alphabetically: A-Z</option>
            <option value="name-desc">Alphabetically: Z-A</option>
          </select>
        </div>
        <div class="product-grid" id="collection-grid"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <div id="app-overlay"></div>

  <div id="app-mobile-menu"></div>

  <div id="app-cart"></div>

  <div id="app-search"></div>

  <div id="app-cookie"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/components.js"></script>
  <script>Layout.init('../');</script>
  <script src="js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/translate.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/mobile-menu.js"></script>
  <script src="../js/effects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.__PRODUCTS__) Store.init();
      function renderCollection() {
        if (!window.__PRODUCTS__) { setTimeout(renderCollection, 100); return; }
        const grid = document.getElementById('collection-grid');
        const countEl = document.getElementById('collection-count');
        if (!grid) return;
        let products = window.__PRODUCTS__.filter(p => p.collection === 'project-files');
        function render(sortValue) {
          let sorted = [...products];
          if (sortValue === 'price-asc') sorted.sort((a, b) => a.price - b.price);
          else if (sortValue === 'price-desc') sorted.sort((a, b) => b.price - a.price);
          else if (sortValue === 'name-asc') sorted.sort((a, b) => a.name.localeCompare(b.name));
          else if (sortValue === 'name-desc') sorted.sort((a, b) => b.name.localeCompare(a.name));
          grid.innerHTML = '';
          if (countEl) countEl.textContent = sorted.length + ' product' + (sorted.length !== 1 ? 's' : '');
          sorted.forEach(product => {
            const pimg = product.image || (product.images ? product.images[0] : null);
            const imageSrc = pimg && (pimg.indexOf('://') > -1 || pimg.indexOf('//') === 0) ? pimg : '../assets/images/' + (pimg || 'placeholder.svg');
            const priceText = product.price === 0 ? 'Free' : 'Rs. ' + product.price.toLocaleString('en-IN') + '.00';
            const priceClass = product.price === 0 ? 'free' : '';
            let badgeHtml = '';
            if (product.badge === 'Best Seller') {
              badgeHtml = '<span class="product-card-badge badge-best-seller">Best Seller</span>';
            } else if (product.badge === 'Popular') {
              badgeHtml = '<span class="product-card-badge badge-popular">Popular</span>';
            } else if (product.badge === 'Free') {
              badgeHtml = '<span class="product-card-badge badge-free">Free</span>';
            } else if (product.badge === 'Demo') {
              badgeHtml = '<span class="product-card-badge badge-demo">Demo</span>';
            }
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-quickview', product.slug);
            card.innerHTML =
              '<div class="product-card-image">' +
                '<img src="' + imageSrc + '" alt="' + product.name + ' - AUROS Premium Premiere Pro ' + product.category + '" loading="lazy">' +
                badgeHtml +
              '</div>' +
              '<div class="product-card-body">' +
                '<div class="product-card-title">' +
                  '<a href="../product.html?slug=' + product.slug + '">' + product.name + '</a>' +
                '</div>' +
                '<div class="product-card-price ' + priceClass + '" data-amount="' + product.price + '" data-currency="' + (product.currency || 'INR') + '">' + priceText + '</div>' +
              '</div>' +
              '<button class="btn btn-primary btn-sm btn-full add-to-cart-btn"' +
                  ' data-id="' + product.id + '"' +
                  ' data-slug="' + product.slug + '"' +
                ' data-name="' + product.name + '"' +
                ' data-price="' + product.price + '"' +
                ' data-currency="' + (product.currency || 'INR') + '"' +
                ' data-image="' + (pimg || 'placeholder.svg') + '">' +
                  'Add to cart' +
              '</button>';
            grid.appendChild(card);
          });
        }
        const sortSelect = document.getElementById('collection-sort');
        if (sortSelect) {
          sortSelect.addEventListener('change', function() { render(this.value); });
        }
        render('featured');
      }
      renderCollection();
    });
  </script>
  <div class="qv-overlay" id="qvOverlay">
    <div class="qv-modal">
      <button class="qv-close" id="qvClose">&times;</button>
      <div class="qv-layout">
        <div class="qv-gallery">
          <img id="qvImage" src="../assets/images/placeholder.svg" alt="">
          <div class="qv-gallery-thumbs" id="qvThumbs"></div>
        </div>
        <div class="qv-info">
          <h2 id="qvName"></h2>
          <div id="qvPrice" class="qv-price"></div>
          <div id="qvCompare" class="qv-compare"></div>
          <div id="qvColors" class="qv-colors"></div>
          <div id="qvDesc" class="qv-desc"></div>
          <ul id="qvFeatures" class="qv-features"></ul>
          <div class="qv-actions">
            <button class="btn btn-primary" id="qvAddToCart">Add to Cart</button>
          </div>
          <div class="qv-view-link"><a id="qvViewLink" href="#">View Full Details &rarr;</a></div>
        </div>
      </div>
    </div>
  </div>
  <div id="app-scroll-top"></div>
</body>
</html>
