<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Log In - AUROS</title>
  <meta name="description" content="Log in or create an account on AUROS.">
  <link rel="canonical" href="/login.html">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/animations.css" rel="stylesheet">
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
  <style>
    .login-page{padding:3rem 1rem 4rem;}
    .login-card{max-width:440px;margin:0 auto;}
    .login-card h1{font-size:1.75rem;font-weight:700;margin-bottom:0.375rem;text-align:center;}
    .login-card > p{text-align:center;color:rgb(var(--color-text-muted));font-size:0.9375rem;margin-bottom:2rem;}
    .login-card .auth-form{display:flex;flex-direction:column;gap:1rem;}
    .login-card .auth-field{display:flex;flex-direction:column;gap:0.375rem;}
    .login-card .auth-field label{font-size:0.8125rem;font-weight:600;color:rgb(var(--color-text-muted));text-transform:uppercase;letter-spacing:0.05em;}
    .login-card .auth-field input{padding:0.75rem 1rem;border:1px solid rgb(var(--color-border));border-radius:0.5rem;font-size:0.9375rem;background:rgb(var(--color-input-bg));color:rgb(var(--color-base-text));transition:border-color 0.2s,box-shadow 0.2s;outline:none;font-family:inherit;width:100%;}
    .login-card .auth-field input:focus{border-color:rgb(var(--color-base-text));box-shadow:0 0 0 2px rgb(var(--color-base-text)/0.1);}
    .login-card .auth-field input.auth-input-error{border-color:#dc2626;}
    .login-card .auth-password-wrap{position:relative;}
    .login-card .auth-password-wrap input{padding-right:2.75rem;}
    .login-card .auth-pw-toggle{position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgb(var(--color-text-muted));padding:0.375rem;display:flex;align-items:center;}
    .login-card .auth-pw-toggle:hover{color:rgb(var(--color-base-text));}
    .login-card .auth-error{font-size:0.875rem;color:#dc2626;padding:0.5rem 0.75rem;background:#fef2f2;border-radius:0.375rem;border:1px solid #fecaca;display:none;}
    .login-card .auth-submit{position:relative;padding:0.875rem;font-size:0.9375rem;margin-top:0.5rem;}
    .login-card .auth-submit.loading .auth-btn-text{visibility:hidden;}
    .login-card .auth-submit.loading .auth-spinner{display:flex!important;position:absolute;inset:0;align-items:center;justify-content:center;}
    .login-divider{display:flex;align-items:center;gap:1rem;margin:2rem 0;color:rgb(var(--color-text-muted));font-size:0.8125rem;}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:rgb(var(--color-border)/0.4);}
    .login-heading{font-size:1.25rem;font-weight:600;margin-bottom:0.25rem;}
    .login-card .auth-terms{text-align:center;font-size:0.75rem;color:rgb(var(--color-text-muted));line-height:1.5;margin-top:0.5rem;}
    .login-card .auth-terms a{text-decoration:underline;color:rgb(var(--color-text-muted));}
    @media(max-width:480px){.login-page{padding:2rem 1rem 3rem;}}
  </style>
</head>
<body>
  <a href="#main" style="position:absolute;left:1rem;top:0.5rem;z-index:100;background:#171717;color:white;padding:0.5rem 1rem;border-radius:0.375rem;transform:translateY(-100%);transition:transform 0.2s;" onfocus="this.style.transform='translateY(0)'" onblur="this.style.transform='translateY(-100%)'">Skip to content</a>
  <div class="page-transition" id="pageTransition"></div>
  <div id="app-header"></div>
  <main id="main">
    <section class="page-section login-page">
      <div class="page-container">
        <nav class="breadcrumbs"><a href="index.html">Home</a><span class="sep">/</span><span class="current">Log In</span></nav>
        <div class="login-card">
          <h1>Welcome</h1>
          <p>Log in to your account or create a new one.</p>

          <!-- Login form -->
          <form class="auth-form" id="loginForm">
            <div class="auth-field">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email" required>
            </div>
            <div class="auth-field">
              <label for="loginPassword">Password</label>
              <div class="auth-password-wrap">
                <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="auth-pw-toggle" data-for="loginPassword" aria-label="Toggle password visibility">
                  <svg class="auth-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="auth-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="auth-error" id="loginError"></div>
            <button type="submit" class="btn btn-primary btn-full auth-submit" id="loginBtn">
              <span class="auth-btn-text">Log In</span>
              <span class="auth-spinner" style="display:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="30 70" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></circle></svg></span>
            </button>
          </form>

          <div class="login-divider"><span>OR</span></div>

          <!-- Signup form -->
          <h2 class="login-heading">Create Account</h2>
          <form class="auth-form" id="signupForm">
            <div class="auth-field">
              <label for="signupName">Full Name</label>
              <input type="text" id="signupName" placeholder="Enter your full name" autocomplete="name" required>
            </div>
            <div class="auth-field">
              <label for="signupEmail">Email</label>
              <input type="email" id="signupEmail" placeholder="Enter your email" autocomplete="email" required>
            </div>
            <div class="auth-field">
              <label for="signupPassword">Password</label>
              <div class="auth-password-wrap">
                <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)" autocomplete="new-password" required minlength="6">
                <button type="button" class="auth-pw-toggle" data-for="signupPassword" aria-label="Toggle password visibility">
                  <svg class="auth-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="auth-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label for="signupConfirm">Confirm Password</label>
              <input type="password" id="signupConfirm" placeholder="Confirm your password" autocomplete="new-password" required>
            </div>
            <div class="auth-error" id="signupError"></div>
            <button type="submit" class="btn btn-primary btn-full auth-submit" id="signupBtn">
              <span class="auth-btn-text">Create Account</span>
              <span class="auth-spinner" style="display:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="30 70" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></circle></svg></span>
            </button>
            <div class="auth-terms">By creating an account, you agree to our <a href="policy/terms.html">Terms</a> and <a href="policy/privacy.html">Privacy Policy</a>.</div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <div id="app-overlay"></div>
  <div id="app-mobile-menu"></div>
  <div id="app-cart"></div>
  <div id="app-search"></div>
  <div id="app-cookie"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script>Layout.init('');</script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var self = Auth;

      function redirectAfterLogin() {
        var returnUrl = sessionStorage.getItem('ab_auth_return');
        if (returnUrl) {
          sessionStorage.removeItem('ab_auth_return');
          window.location.href = returnUrl;
        } else {
          window.location.href = 'account.html';
        }
      }

      function showError(formId, msg) {
        var el = document.getElementById(formId);
        if (el) { el.textContent = msg; el.style.display = ''; }
      }

      function clearErrors() {
        document.querySelectorAll('.auth-error').forEach(function(el) { el.textContent = ''; el.style.display = 'none'; });
        document.querySelectorAll('.auth-input-error').forEach(function(el) { el.classList.remove('auth-input-error'); });
      }

      // Login submit
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        clearErrors();
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;
        if (!email) { showError('loginError', 'Please enter your email.'); return; }
        if (!password) { showError('loginError', 'Please enter your password.'); return; }
        var btn = document.getElementById('loginBtn');
        btn.classList.add('loading');
        setTimeout(function() {
          var result = self.login(email, password);
          btn.classList.remove('loading');
          if (result.ok) {
            redirectAfterLogin();
          } else {
            showError('loginError', result.error);
          }
        }, 400);
      });

      // Signup submit
      document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        clearErrors();
        var name = document.getElementById('signupName').value.trim();
        var email = document.getElementById('signupEmail').value.trim();
        var password = document.getElementById('signupPassword').value;
        var confirm = document.getElementById('signupConfirm').value;
        if (!name) { showError('signupError', 'Please enter your full name.'); return; }
        if (!email) { showError('signupError', 'Please enter your email.'); return; }
        if (!password || password.length < 6) { showError('signupError', 'Password must be at least 6 characters.'); return; }
        if (password !== confirm) { showError('signupError', 'Passwords do not match.'); return; }
        var btn = document.getElementById('signupBtn');
        btn.classList.add('loading');
        setTimeout(function() {
          var result = self.signup(name, email, password);
          btn.classList.remove('loading');
          if (result.ok) {
            redirectAfterLogin();
          } else {
            showError('signupError', result.error);
          }
        }, 400);
      });

      // Password visibility toggle
      document.querySelectorAll('.auth-pw-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var inputId = this.getAttribute('data-for');
          var input = document.getElementById(inputId);
          if (input) {
            var isPw = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPw ? 'text' : 'password');
            this.querySelector('.auth-eye').style.display = isPw ? 'none' : '';
            this.querySelector('.auth-eye-off').style.display = isPw ? '' : 'none';
          }
        });
      });
    });
  </script>
  <script src="js/toast.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/effects.js"></script>
  <div class="qv-overlay" id="qvOverlay">
    <div class="qv-modal">
      <button class="qv-close" id="qvClose">&times;</button>
      <div class="qv-layout">
        <div class="qv-gallery"><img id="qvImage" src="assets/images/placeholder.svg" alt=""><div class="qv-gallery-thumbs" id="qvThumbs"></div></div>
        <div class="qv-info"><h2 id="qvName"></h2><div id="qvPrice" class="qv-price"></div><div id="qvCompare" class="qv-compare"></div><div id="qvColors" class="qv-colors"></div><div id="qvDesc" class="qv-desc"></div><ul id="qvFeatures" class="qv-features"></ul><div class="qv-actions"><button class="btn btn-primary" id="qvAddToCart">Add to Cart</button></div><div class="qv-view-link"><a id="qvViewLink" href="#">View Full Details &rarr;</a></div></div>
      </div>
    </div>
  </div>
  <div id="app-scroll-top"></div>
</body>
</html>
